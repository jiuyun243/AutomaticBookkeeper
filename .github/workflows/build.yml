name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 1. 设置 Node.js (Capacitor 必须)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
        node-version: '22'  # 强制使用 Node 22
        cache: 'npm'        # 启用缓存加速

      - name: Install Dependencies
        run: npm ci           # 推荐使用 ci 而非 install，更稳定
      # 2. 安装依赖
      - name: Install Dependencies
        run: npm install

      # 3. 设置 Java 17 (Capacitor 7+ 强制要求)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      # 4. ⚠️ 关键修复：手动配置 Android SDK 环境变量
      # 既然自动插件报错，我们就手动告诉服务器 SDK 在哪
      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=/opt/hostedtoolcache/Android/Sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/opt/hostedtoolcache/Android/Sdk" >> $GITHUB_ENV
          echo "PATH=$PATH:/opt/hostedtoolcache/Android/Sdk/cmdline-tools/latest/bin" >> $GITHUB_ENV

      # 5. 赋予 Gradle 执行权限
      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      # 6. 开始构建
      # 在 Build with Gradle 之前加入这一段
      - name: Sync Capacitor
        run: |
         chmod -R +x ./node_modules/.bin/
         npx cap sync android

      - name: Build with Gradle
        run: cd android && ./gradlew assembleDebug --no-daemon --stacktrace

      # 7. 上传 APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoBill-App-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
