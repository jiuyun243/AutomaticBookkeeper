name: Build Android APK

on:
  push:
    branches: [main] # 每次推送到 main 分支时触发
  workflow_dispatch: # 允许手动点击按钮触发

jobs:
  build:
    runs-on: ubuntu-latest # 使用最新的 Ubuntu 服务器

    steps:
      - uses: actions/checkout@v4 # 下载你的代码

      - name: Set up JDK 17 # 安装 Java 环境
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK # 安装安卓工具链
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew # 给构建脚本权限
        run: chmod +x android/gradlew

      - name: Build Debug APK # 开始打包！
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK # 把打好的包上传到页面
        uses: actions/upload-artifact@v4
        with:
          name: my-autobill-app # 下载时的文件名
          path: android/app/build/outputs/apk/debug/app-debug.apk
